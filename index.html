<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nick Pearson - Pearson Works</title>
  <meta name="description" content="Nick Pearson - sculptor, maker, restorer. Handmade metal sculpture and garden tool sharpening and repair.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* ─── THEME TOKENS ─────────────────────────────────────────────────── */
    :root[data-theme="dark"] {
      --bg:         #080808;
      --bg-surface: #111111;
      --fg:         #e8e0d8;
      --fg-muted:   #8a8078;
      --accent:     #C07A28;
      --accent-hover: #d4892e;
      --border:     rgba(255,255,255,0.08);
      --overlay:    rgba(0,0,0,0.85);
      --toggle-bg:  #1e1e1e;
      --toggle-icon: "☀";
      --shadow:     0 4px 32px rgba(0,0,0,0.6);
      --tile-overlay: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.72) 100%);
      --modal-bg:   #111111;
      --input-bg:   #1a1a1a;
      --input-border: rgba(255,255,255,0.12);
    }

    :root[data-theme="light"] {
      --bg:         #f5f3f0;
      --bg-surface: #ffffff;
      --fg:         #1a1814;
      --fg-muted:   #6b6358;
      --accent:     #a0621c;
      --accent-hover: #b5711f;
      --border:     rgba(0,0,0,0.10);
      --overlay:    rgba(0,0,0,0.82);
      --toggle-bg:  #e4e0da;
      --shadow:     0 4px 32px rgba(0,0,0,0.12);
      --tile-overlay: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.65) 100%);
      --modal-bg:   #ffffff;
      --input-bg:   #f5f3f0;
      --input-border: rgba(0,0,0,0.14);
    }

    /* ─── RESET ────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ─── HEADER ───────────────────────────────────────────────────────── */
    header {
      padding: 28px 32px 20px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .wordmark-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--fg);
      text-transform: uppercase;
      line-height: 1;
    }

    .wordmark-sub {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* ─── THEME TOGGLE ─────────────────────────────────────────────────── */
    .theme-toggle {
      background: var(--toggle-bg);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s, color 0.2s;
    }

    .theme-toggle:hover { color: var(--fg); border-color: var(--accent); }

    .toggle-icon { font-size: 0.85rem; }

    /* ─── TAGLINE ──────────────────────────────────────────────────────── */
    .tagline {
      text-align: center;
      padding: 12px 40px 44px;
      max-width: 720px;
      margin: 0 auto;
    }

    .quote-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 2.4vw, 1.45rem);
      color: var(--fg-muted);
      letter-spacing: 0.03em;
      line-height: 1.55;
      margin-bottom: 10px;
      quotes: none;
      opacity: 0;
      animation: quoteFade 0.9s ease 0.3s forwards;
    }

    .quote-attr {
      display: block;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-style: normal;
      opacity: 0;
      animation: quoteFade 0.9s ease 0.55s forwards;
    }

    @keyframes quoteFade {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── TILE GRID ────────────────────────────────────────────────────── */
    main {
      flex: 1;
      padding: 0 32px 60px;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ─── TILE ─────────────────────────────────────────────────────────── */
    .tile {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 3 / 4;
      background: var(--bg-surface);
      display: block;
      text-decoration: none;

      /* GPU layer for smooth transforms */
      transform: translateZ(0);
      transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  box-shadow 0.35s ease;
    }

    .tile:hover {
      transform: scale(1.015);
      box-shadow: var(--shadow);
    }

    .tile:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ─── TILE PHOTO ───────────────────────────────────────────────────── */
    .tile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      /*
        GIF SWAP INSTRUCTIONS:
        To enable the animated hover effect, add a data-gif attribute to the
        <img> tag with the path to your GIF file, e.g.:
          data-gif="images/hub-sculpture.gif"
        The JavaScript at the bottom handles the rest - no other changes needed.
      */
    }

    /* ─── TILE OVERLAY / CAPTION ───────────────────────────────────────── */
    .tile-caption {
      position: absolute;
      inset: 0;
      background: var(--tile-overlay);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px 24px;
      transition: background 0.3s ease;
    }

    .tile:hover .tile-caption {
      background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.82) 100%);
    }

    .tile-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 300;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    }

    .tile-cta {
      margin-top: 8px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.28s ease, transform 0.28s ease;
    }

    .tile:hover .tile-cta,
    .tile:focus-visible .tile-cta {
      opacity: 1;
      transform: translateY(0);
    }

    /* ─── FOOTER ───────────────────────────────────────────────────────── */
    footer {
      padding: 28px 32px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-copy {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    .footer-links {
      display: flex;
      gap: 24px;
    }

    .footer-links a {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--accent); }

    /* ─── MOBILE ───────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      header {
        padding: 20px 20px 16px;
      }

      .tagline {
        padding: 8px 20px 28px;
      }

      main {
        padding: 0 16px 48px;
      }

      .tile-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .tile {
        aspect-ratio: 4 / 3;
      }

      footer {
        padding: 20px;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

    }

    @media (min-width: 601px) and (max-width: 900px) {
      .tile-grid {
        gap: 14px;
      }
    }

    /* ─── FADE-IN ON SCROLL (tiles) ────────────────────────────────────── */
    .tile {
      opacity: 0;
      animation: tileReveal 0.65s ease forwards;
    }

    .tile:nth-child(1) { animation-delay: 0.1s; }
    .tile:nth-child(2) { animation-delay: 0.22s; }

    @keyframes tileReveal {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* override: once hovered, scale not translateY */
    .tile:hover { transform: scale(1.015); }

  </style>
</head>

<body>

  <!-- ─── HEADER ─────────────────────────────────────────────────────── -->
  <header>
    <div class="wordmark">
      <span class="wordmark-name">Nick Pearson</span>
      <span class="wordmark-sub">Pearson Works</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle colour mode">
      <span class="toggle-icon" id="toggleIcon">☀</span>
      <span id="toggleLabel">Light mode</span>
    </button>
  </header>

  <!-- ─── ROTATING QUOTE ──────────────────────────────────────────────── -->
  <div class="tagline" id="quoteBlock" aria-live="polite">
    <blockquote class="quote-text" id="quoteText"></blockquote>
    <cite class="quote-attr" id="quoteAttr"></cite>
  </div>

  <!-- ─── TILES ──────────────────────────────────────────────────────── -->
  <main>
    <div class="tile-grid">

      <!-- TILE 1: Sculptures -->
      <a class="tile" href="/sculptures" aria-label="Explore handmade metal sculpture">
        <!-- Replace src with your actual image path. Add data-gif="images/hub-sculpture.gif" to enable hover GIF. -->
        <img
          class="tile-img"
          src="images/hub-sculpture.jpg"
          alt="UV-lit metal sculpture - ant and spider under purple light"
          loading="eager"
        >
        <div class="tile-caption">
          <h2 class="tile-title">Sculpture</h2>
          <span class="tile-cta">Explore the work &rarr;</span>
        </div>
      </a>

      <!-- TILE 2: Garden Tools -->
      <a class="tile" href="/gardentools" aria-label="Garden tool sharpening and repair">
        <!-- Add data-gif="images/hub-tools.gif" to enable hover GIF. -->
        <img
          class="tile-img"
          src="images/hub-tools.jpg"
          alt="Workshop sparks - tool sharpening and metalwork"
          loading="eager"
        >
        <div class="tile-caption">
          <h2 class="tile-title">Garden Tools</h2>
          <span class="tile-cta">Sharpened weekly, from &pound;8 &rarr;</span>
        </div>
      </a>

    </div>
  </main>

  <!-- ─── FOOTER ─────────────────────────────────────────────────────── -->
  <footer>
    <span class="footer-copy">&copy; 2026 Nick Pearson</span>
    <nav class="footer-links" aria-label="Footer navigation">
      <a href="mailto:mrnickpearson@gmail.com">Contact</a>
      <a href="https://www.freestyleropeart.com" target="_blank" rel="noopener">Rope Art Practice</a>
    </nav>
  </footer>

  <!-- ─── JAVASCRIPT ──────────────────────────────────────────────────── -->
  <script>
    /* ══════════════════════════════════════════════════════════════════════
       ADD QUOTES HERE
       Each entry is: { text: "The quote.", attr: "Person or Source" }
       Add a new line following the same pattern. One quote is picked at
       random each time the page loads.
       ══════════════════════════════════════════════════════════════════════ */
    var QUOTES = [
      { text: "We don't make mistakes, just happy little accidents.", attr: "Bob Ross" },
      { text: "An artist is somebody who produces things that people don't need to have.", attr: "Andy Warhol" },
      { text: "Life is art. Art is life. I never separate it.", attr: "Ai Weiwei" },
      { text: "To be an artist is to believe in life.", attr: "Henry Moore" },
      { text: "The object of art is not to reproduce reality, but to create a reality of the same intensity.", attr: "Alberto Giacometti" },
      { text: "Art is not a mirror held up to reality, but a hammer with which to shape it.", attr: "Bertolt Brecht" },
      { text: "Painting is a diary.", attr: "Pablo Picasso" },
      { text: "Life is 50:50. There is no wrong way, just learning.", attr: "Nicholas Pearson" }
    ];

    (function () {
      var pick = QUOTES[ Math.floor(Math.random() * QUOTES.length) ];
      document.getElementById('quoteText').textContent = '“' + pick.text + '”';
      document.getElementById('quoteAttr').textContent = '- ' + pick.attr;
    }());

    /* ── THEME ─────────────────────────────────────────────────────────── */
    (function () {
      const html       = document.documentElement;
      const btn        = document.getElementById('themeToggle');
      const icon       = document.getElementById('toggleIcon');
      const label      = document.getElementById('toggleLabel');
      const LS_KEY     = 'np-theme';

      function applyTheme(theme) {
        html.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          icon.textContent  = '☀'; // sun
          label.textContent = 'Light mode';
        } else {
          icon.textContent  = '☽'; // crescent
          label.textContent = 'Dark mode';
        }
        try { localStorage.setItem(LS_KEY, theme); } catch (e) {}
      }

      // Initial theme: stored preference > OS preference > dark
      let initial = 'dark';
      try {
        const stored = localStorage.getItem(LS_KEY);
        if (stored) {
          initial = stored;
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          initial = 'light';
        }
      } catch (e) {}

      applyTheme(initial);

      btn.addEventListener('click', function () {
        const current = html.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });
    }());


    /* ── GIF HOVER SWAP (desktop) / AUTO-PLAY (mobile) ─────────────────── */
    (function () {
      var isMobile = window.matchMedia('(hover: none)').matches;

      document.querySelectorAll('.tile-img[data-gif]').forEach(function (img) {
        var staticSrc = img.src;
        var gifSrc    = img.getAttribute('data-gif');

        if (!gifSrc) return;

        if (isMobile) {
          // On mobile: swap to GIF when tile is 40% in view
          if ('IntersectionObserver' in window) {
            var observer = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                img.src = entry.isIntersecting ? gifSrc : staticSrc;
              });
            }, { threshold: 0.4 });
            observer.observe(img.closest('.tile') || img.parentElement);
          } else {
            img.src = gifSrc; // fallback: always show GIF
          }
        } else {
          // On desktop: swap on hover
          var tile = img.closest('.tile') || img.parentElement;
          tile.addEventListener('mouseenter', function () { img.src = gifSrc; });
          tile.addEventListener('mouseleave', function () { img.src = staticSrc; });
        }
      });
    }());


  </script>

</body>
</html>
